<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f15"/>
      <stop offset="50%" stop-color="#09090c"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="280" rx="22" fill="url(#bgGrad)"/>
  <rect width="400" height="280" rx="22" fill="url(#dotGrid)"/>
  <rect width="400" height="280" rx="22" fill="url(#centerGlow)"/>

  <!-- Top Gloss Highlight -->
  <path d="M 0 22 C 0 10 10 0 22 0 L 378 0 C 390 0 400 10 400 22 L 400 85 Q 200 135 0 85 Z" fill="url(#glossGrad)"/>

  <!-- Card Perimeter Border -->
  <rect x="1" y="1" width="398" height="278" rx="21" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Category Badge (Top-Left) -->
  <g transform="translate(22, 20)">
    <rect width="105" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="11" cy="11" r="3" fill="#10b981"/>
    <text x="21" y="14.5" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="rgba(255,255,255,0.75)" letter-spacing="0.1em">WRITING</text>
  </g>

  <!-- Top-Right Brand Mark -->
  <g transform="translate(320, 20)">
    <text x="56" y="14" text-anchor="end" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="500" fill="rgba(255,255,255,0.3)" letter-spacing="0.12em">ZAE LABS</text>
  </g>

  <!-- Center Artwork / Emblem -->
  <g transform="translate(200, 126)">
    
  <circle cx="0" cy="0" r="52" fill="#10b981" opacity="0.15" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <!-- Shield / Badge -->
    <path d="M 0 -34 L 28 -20 L 28 8 C 28 24 16 34 0 40 C -16 34 -28 24 -28 8 L -28 -20 Z" fill="#06281e" stroke="#10b981" stroke-width="2.2"/>
    <!-- Checkmark inside -->
    <path d="M -12 2 L -3 11 L 14 -7" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Glowing text lines below -->
    <line x1="-14" y1="20" x2="14" y2="20" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  </g>

  </g>

  <!-- Bottom Divider Line -->
  <line x1="22" y1="222" x2="378" y2="222" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Bottom Details -->
  <text x="22" y="247" font-family="'Inter', system-ui, sans-serif" font-size="18.5" font-weight="600" fill="#ffffff" letter-spacing="-0.02em">Grammar Checker</text>
  <text x="22" y="263" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.45)" letter-spacing="0.04em">English Grammar & Spell Check</text>

  <!-- Bottom-Right Open Button Affordance -->
  <g transform="translate(362, 248)">
    <circle r="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <path d="M -3 -3 L 3 3 M 3 -3 L 3 3 L -3 3" stroke="#10b981" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>